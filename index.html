<script>
class MotionSketchVector {
    constructor() {
        this.canvas = document.getElementById('rendering-canvas');
        this.canvasWrapper = document.getElementById('canvas-wrapper');
        this.ctx = this.canvas.getContext('2d');
        this.framesList = document.getElementById('frames-list');
        this.frames = [{ strokes: [] }]; 
        this.paperStrokes = []; 
        this.frameIndex = 0;
        
        this.activeLayer = 'ink'; 
        this.tool = 'brush'; 
        
        this.brushColor = '#000000';
        this.brushSize = 10;
        this.opacity = 1.0;
        
        this.isDrawing = false;
        this.currentStroke = null; 
        
        this.selectedObject = null; 
        this.selectedBgColor = '#ffffff';
        this.dragMode = null; 
        
        this.isPlaying = false;
        this.fps = 12;
        this.isOnion = false;
        this.isWiggle = false;
        
        this.canvasWidth = 600;
        this.canvasHeight = 600;
        this.zoom = 1.0; // Zoom level
        
        this.textInputPos = {x:0, y:0};
        
        // Palette State
        this.palette = ['#000000', '#ffffff', '#FF3B30', '#FF9500', '#FFCC00', '#4CD964', '#5AC8FA', '#007AFF', '#5856D6', '#8E8E93'];
        this.paletteEditIndex = -1;

        this.history = [];
        this.redoStack = [];
        
        this.init();
    }

    init() {
        this.loadTheme();
        this.setupEvents();
        this.handleResize(); 
        window.addEventListener('resize', () => this.handleResize()); 
        this.resizeCanvas(this.canvasWidth, this.canvasHeight);
        this.loadStorage();
        this.renderUI(); 
        
        const picker = document.getElementById('html-color-picker');
        if(picker) picker.value = this.brushColor;
    }
    
    /* --- Theme Handling --- */
    loadTheme() {
        const theme = localStorage.getItem('motionSketchTheme') || 'dark';
        document.body.setAttribute('data-theme', theme);
        this.updateThemeIcon(theme);
    }

    toggleTheme() {
        const current = document.body.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', next);
        localStorage.setItem('motionSketchTheme', next);
        this.updateThemeIcon(next);
    }

    updateThemeIcon(theme) {
        const icon = document.getElementById('theme-icon');
        if(!icon) return;
        if (theme === 'light') {
            icon.className = 'fas fa-sun';
        } else {
            icon.className = 'fas fa-moon';
        }
    }
    
    /* --- Zoom Handling --- */
    adjustZoom(delta) {
        this.zoom = Math.max(0.1, Math.min(5.0, this.zoom + delta));
        this.applyZoom();
    }
    
    resetZoom() {
        this.zoom = 1.0;
        this.applyZoom();
    }
    
    applyZoom() {
        document.getElementById('zoom-disp').innerText = Math.round(this.zoom * 100) + '%';
        this.canvasWrapper.style.transform = `scale(${this.zoom})`;
        // Transform origin helps keep centering logical
        // But with overflow: auto grid centering, standard scaling might drift.
        // grid center + scale works if margin handles overflow.
        // Actually, if we scale the element, the grid cell stays same size unless we change width/height.
        // Better approach: Change width/height of wrapper instead of transform?
        // No, transform is smoother. Let's set transform-origin.
        // If we use zoom property? Non-standard.
        // CSS Transform scale does NOT affect layout flow, so scrollbars won't appear automatically
        // UNLESS we wrap it in a container that sizes to match.
        // Let's try setting width/height instead of transform for flow-based scrolling?
        // Or use Zoom property (works in Chrome/Safari/Edge).
        // Let's stick to style.width/height for the wrapper to force layout update.
        
        // Re-run handleResize logic but apply zoom multiplier
        this.handleResize(); 
    }

    handleResize() {
        const workspace = document.querySelector('.workspace');
        if(!workspace) return;
        
        // Get base fit dimensions
        const availW = workspace.clientWidth - 100; // Padding
        const availH = workspace.clientHeight - 100;
        const aspect = this.canvasWidth / this.canvasHeight;
        let w, h;
        
        if (availW / availH > aspect) {
             h = availH; w = h * aspect;
        } else {
             w = availW; h = w / aspect;
        }
        
        // Apply Zoom
        w *= this.zoom;
        h *= this.zoom;
        
        // Use pixel sizes to force scrolling
        this.canvasWrapper.style.width = `${w}px`;
        this.canvasWrapper.style.height = `${h}px`;
        
        // Reset transform because we are sizing explicitly
        this.canvasWrapper.style.transform = 'none';
    }

    setupEvents() {
        const c = this.canvas;
        
        const start = (e) => this.onDown(this.getPos(e), e.pressure);
        const move = (e) => {
            let p = e.pressure;
            if (e.pointerType === 'mouse' && e.buttons === 1) p = 0.5;
            this.onMove(this.getPos(e), p);
        };
        const end = (e) => this.onUp();

        c.addEventListener('pointerdown', (e) => {
            c.setPointerCapture(e.pointerId);
            start(e);
        });
        window.addEventListener('pointermove', (e) => {
             if (this.isDrawing || this.selectedObject) move(e);
        });
        window.addEventListener('pointerup', (e) => {
            c.releasePointerCapture(e.pointerId);
            end(e);
        });

        c.addEventListener('touchstart', (e) => e.preventDefault(), {passive: false});
        c.addEventListener('touchmove', (e) => e.preventDefault(), {passive: false});

        document.addEventListener('click', (e) => {
            const shapeWrapper = document.getElementById('shape-wrapper');
            if (shapeWrapper && !shapeWrapper.contains(e.target)) {
                shapeWrapper.classList.remove('expanded');
            }
        });

        document.addEventListener('keydown', (e) => {
            if(e.target.tagName === 'INPUT') return; 
            
            if(e.key === 'Delete' || e.key === 'Backspace') {
                if (this.selectedObject) {
                    this.deleteSelected();
                } else {
                    this.deleteFrame();
                }
            }
            
            if(e.key === 'd' || e.key === 'D') this.duplicateFrame();
            if(e.key === 'n' || e.key === 'N') this.addFrame();
            if(e.code === 'Space') { e.preventDefault(); this.togglePlay(); } 

            if((e.ctrlKey || e.metaKey) && e.key === 'c') this.copySelection();
            if((e.ctrlKey || e.metaKey) && e.key === 'v') this.pasteSelection();
            if((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); this.undo(); }
            if((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); this.redo(); }
            
            if(e.key === 'b') this.setTool('brush');
            if(e.key === 'e') this.setTool('eraser');
            if(e.key === 'v') this.setTool('select');
            if(e.key === 'f') this.setTool('bucket');
            if(e.key === 't') this.setTool('text');
            
            if(e.key === 'ArrowLeft') {
                if(this.frameIndex > 0) {
                    this.frameIndex--;
                    this.renderCanvas();
                    this.renderUI(true);
                }
            }
            if(e.key === 'ArrowRight') {
                if(this.frameIndex < this.frames.length - 1) {
                    this.frameIndex++;
                    this.renderCanvas();
                    this.renderUI(true);
                }
            }
        });
    }

    getPos(e) {
        const rect = this.canvas.getBoundingClientRect();
        // We need to map visual coordinates (rect) to internal coordinates (canvasWidth/Height)
        // rect changes with zoom. canvas.width stays 600.
        // This logic handles zoom automatically because rect size reflects zoom.
        const scaleX = this.canvasWidth / rect.width;
        const scaleY = this.canvasHeight / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    resizeCanvas(w, h) {
        this.canvasWidth = w;
        this.canvasHeight = h;
        this.canvas.width = w;
        this.canvas.height = h;
        this.canvasWrapper.style.aspectRatio = `${w}/${h}`;
        this.handleResize();
        this.renderCanvas();
    }
    
    openSettings() {
        document.getElementById('canvas-width').value = this.canvasWidth;
        document.getElementById('canvas-height').value = this.canvasHeight;
        document.getElementById('settings-modal').style.display = 'flex';
    }

    applySettings() {
        const w = parseInt(document.getElementById('canvas-width').value) || 600;
        const h = parseInt(document.getElementById('canvas-height').value) || 600;
        this.resizeCanvas(w, h);
        this.closeModal('settings-modal');
        this.saveStorage();
    }
    
    /* --- Text Modal --- */
    openTextModal(pos) {
        this.textInputPos = pos;
        document.getElementById('text-input-value').value = "";
        document.getElementById('text-modal').style.display = 'flex';
        document.getElementById('text-input-value').focus();
    }
    
    confirmAddText() {
        const val = document.getElementById('text-input-value').value;
        if (val) {
            this.saveState();
            this.ctx.font = `${this.brushSize * 2 + 20}px sans-serif`;
            const m = this.ctx.measureText(val);
            const h = this.brushSize * 2 + 20;
            
            const textObj = {
                type: 'text',
                text: val,
                x: this.textInputPos.x,
                y: this.textInputPos.y,
                width: m.width,
                height: h,
                sx: 1, sy: 1,
                color: this.brushColor,
                size: h,
                opacity: this.opacity,
                points: [] 
            };
            const list = this.activeLayer === 'ink' ? this.frames[this.frameIndex].strokes : this.paperStrokes;
            list.push(textObj);
            
            this.renderCanvas();
            this.saveStorage();
        }
        this.closeModal('text-modal');
        this.setTool('select'); 
    }

    /* --- Palette Management --- */
    renderPalette() {
        const container = document.getElementById('palette-container');
        container.innerHTML = '';
        this.palette.forEach((color, index) => {
            const div = document.createElement('div');
            div.className = 'swatch';
            div.style.backgroundColor = color;
            if (this.brushColor === color) div.classList.add('active');
            
            // Single Tap: Select
            div.onclick = () => this.setColor(color);
            
            // Double Click: Edit
            div.ondblclick = (e) => {
                e.stopPropagation(); 
                this.openPaletteEditor(index);
            }
            
            let lastTap = 0;
            div.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 500 && tapLength > 0) {
                    e.preventDefault(); 
                    this.openPaletteEditor(index);
                }
                lastTap = currentTime;
            });

            container.appendChild(div);
        });
    }

    openPaletteEditor(index) {
        this.paletteEditIndex = index;
        const input = document.getElementById('palette-editor-input');
        input.value = this.palette[index];
        input.click();
    }

    confirmPaletteEdit(newColor) {
        if (this.paletteEditIndex > -1) {
            this.palette[this.paletteEditIndex] = newColor;
            this.renderPalette();
            this.setColor(newColor); 
            this.saveStorage();
        }
    }

    /* --- History --- */
    saveState() {
        if (this.history.length > 20) this.history.shift();
        this.redoStack = [];
        const state = {
            frames: JSON.parse(JSON.stringify(this.frames)),
            paperStrokes: JSON.parse(JSON.stringify(this.paperStrokes)),
            frameIndex: this.frameIndex,
            bgColor: this.selectedBgColor,
            width: this.canvasWidth,
            height: this.canvasHeight,
            palette: this.palette
        };
        this.history.push(JSON.stringify(state));
    }

    undo() {
        if (this.history.length === 0) return;
        const currentState = {
            frames: JSON.parse(JSON.stringify(this.frames)),
            paperStrokes: JSON.parse(JSON.stringify(this.paperStrokes)),
            frameIndex: this.frameIndex,
            bgColor: this.selectedBgColor,
            width: this.canvasWidth,
            height: this.canvasHeight,
            palette: this.palette
        };
        this.redoStack.push(JSON.stringify(currentState));
        const prevState = JSON.parse(this.history.pop());
        this.frames = prevState.frames;
        this.paperStrokes = prevState.paperStrokes;
        this.frameIndex = prevState.frameIndex;
        this.selectedBgColor = prevState.bgColor;
        if(prevState.palette) {
            this.palette = prevState.palette;
            this.renderPalette();
        }
        if(prevState.width && prevState.height) this.resizeCanvas(prevState.width, prevState.height);
        this.selectedObject = null;
        this.updateThumbnails();
        this.renderCanvas();
        this.renderUI(true);
    }

    redo() {
        if (this.redoStack.length === 0) return;
        const currentState = {
            frames: JSON.parse(JSON.stringify(this.frames)),
            paperStrokes: JSON.parse(JSON.stringify(this.paperStrokes)),
            frameIndex: this.frameIndex,
            bgColor: this.selectedBgColor,
            width: this.canvasWidth,
            height: this.canvasHeight,
            palette: this.palette
        };
        this.history.push(JSON.stringify(currentState));
        const nextState = JSON.parse(this.redoStack.pop());
        this.frames = nextState.frames;
        this.paperStrokes = nextState.paperStrokes;
        this.frameIndex = nextState.frameIndex;
        this.selectedBgColor = nextState.bgColor;
        if(nextState.palette) {
            this.palette = nextState.palette;
            this.renderPalette();
        }
        if(nextState.width && nextState.height) this.resizeCanvas(nextState.width, nextState.height);
        this.selectedObject = null;
        this.updateThumbnails();
        this.renderCanvas();
        this.renderUI(true);
    }

    /* --- Core Logic --- */

    onDown(pos, pressure = 0.5) {
        if(this.isPlaying) return;

        if (this.tool === 'bucket') {
            this.saveState();
            const found = this.hitTest(pos);
            if (found) {
                found.stroke.fillColor = this.brushColor;
                if (found.stroke.type === 'text') found.stroke.color = this.brushColor; 
                this.renderCanvas();
            } else {
                this.selectedBgColor = this.brushColor;
                this.frames[this.frameIndex].frameBgColor = this.brushColor; 
                this.updateThumbnails(); 
                this.renderCanvas();
            }
            this.saveStorage();
            return;
        }
        
        if (this.tool === 'text') {
            this.openTextModal(pos);
            return;
        }

        if (this.tool === 'select') {
            if (this.selectedObject) {
                const handle = this.hitTestHandles(pos);
                if (handle) {
                    this.saveState();
                    this.dragMode = handle;
                    this.dragStart = pos;
                    if (this.selectedObject.stroke.type === 'text') {
                        this.dragOriginalProps = {
                            x: this.selectedObject.stroke.x,
                            y: this.selectedObject.stroke.y,
                            w: this.selectedObject.stroke.width,
                            h: this.selectedObject.stroke.height,
                            sx: this.selectedObject.stroke.sx,
                            sy: this.selectedObject.stroke.sy
                        };
                    } else {
                        this.dragOriginalPoints = this.selectedObject.stroke.points.map(p => ({...p}));
                    }
                    this.dragOriginalBounds = {...this.selectedObject.bounds};
                    this.dragCenter = {
                        x: this.selectedObject.bounds.x + this.selectedObject.bounds.w/2,
                        y: this.selectedObject.bounds.y + this.selectedObject.bounds.h/2
                    };
                    return;
                }
                
                if (this.isInBounds(pos, this.selectedObject.bounds)) {
                    this.saveState();
                    this.dragMode = 'move';
                    this.dragStart = pos;
                    if (this.selectedObject.stroke.type === 'text') {
                        this.dragOriginalProps = {
                            x: this.selectedObject.stroke.x,
                            y: this.selectedObject.stroke.y,
                        };
                    } else {
                        this.dragOriginalPoints = this.selectedObject.stroke.points.map(p => ({...p}));
                    }
                    return;
                }
            }
            
            const found = this.hitTest(pos);
            if (found) {
                this.saveState();
                this.selectedObject = found;
                this.calcBounds(found.stroke);
                this.dragMode = 'move';
                this.dragStart = pos;
                if (found.stroke.type === 'text') {
                    this.dragOriginalProps = { x: found.stroke.x, y: found.stroke.y };
                } else {
                    this.dragOriginalPoints = found.stroke.points.map(p => ({...p}));
                }
            } else {
                this.selectedObject = null;
            }
            this.renderCanvas();
            return;
        }

        this.saveState();
        this.isDrawing = true;
        this.selectedObject = null;
        this.dragStart = pos; 
        
        const p = (typeof pressure === 'number') ? pressure : 0.5;
        if (p <= 0) p = 0.5;

        this.currentStroke = {
            type: this.tool, 
            color: this.tool === 'eraser' ? '#ffffff' : this.brushColor,
            size: this.brushSize,
            opacity: this.opacity,
            points: [{x: pos.x, y: pos.y, p: p}], 
            fillColor: null,
            sx: 1, sy: 1 // Initialize scale for dots
        };
        
        const list = this.activeLayer === 'ink' ? this.frames[this.frameIndex].strokes : this.paperStrokes;
        list.push(this.currentStroke);
        this.renderCanvas();
    }

    onMove(pos, pressure = 0.5) {
        if (this.isPlaying) return;

        if (this.tool === 'select' && this.dragMode && this.selectedObject) {
            const stroke = this.selectedObject.stroke;
            const bounds = this.dragOriginalBounds;

            if (this.dragMode === 'move') {
                const dx = pos.x - this.dragStart.x;
                const dy = pos.y - this.dragStart.y;
                
                if (stroke.type === 'text') {
                    stroke.x = this.dragOriginalProps.x + dx;
                    stroke.y = this.dragOriginalProps.y + dy;
                } else {
                    const pts = stroke.points;
                    const origPts = this.dragOriginalPoints;
                    for(let i=0; i<pts.length; i++) {
                        pts[i].x = origPts[i].x + dx;
                        pts[i].y = origPts[i].y + dy;
                    }
                }
            } 
            else if (this.dragMode === 'rotate') {
                if (stroke.type !== 'text') {
                    const startAngle = Math.atan2(this.dragStart.y - this.dragCenter.y, this.dragStart.x - this.dragCenter.x);
                    const currAngle = Math.atan2(pos.y - this.dragCenter.y, pos.x - this.dragCenter.x);
                    const angleDiff = currAngle - startAngle;
                    
                    const cos = Math.cos(angleDiff), sin = Math.sin(angleDiff);
                    
                    const pts = stroke.points;
                    const origPts = this.dragOriginalPoints;
                    
                    for(let i=0; i<pts.length; i++) {
                        const nx = origPts[i].x - this.dragCenter.x;
                        const ny = origPts[i].y - this.dragCenter.y;
                        pts[i].x = (nx * cos - ny * sin) + this.dragCenter.x;
                        pts[i].y = (nx * sin + ny * cos) + this.dragCenter.y;
                    }
                }
            }
            else {
                // Resize
                const dx = pos.x - this.dragStart.x;
                const dy = pos.y - this.dragStart.y;
                let newW = bounds.w, newH = bounds.h, newX = bounds.x, newY = bounds.y;
                const dir = this.dragMode.split('-')[1] || '';

                if (dir.includes('r')) newW += dx; 
                if (dir.includes('l')) { newX += dx; newW -= dx; } 
                if (dir.includes('b')) newH += dy; 
                if (dir.includes('t')) { newY += dy; newH -= dy; } 

                if(newW < 5) newW = 5; if(newH < 5) newH = 5;

                if (stroke.type === 'text') {
                    stroke.sx = newW / this.dragOriginalProps.w;
                    stroke.sy = newH / this.dragOriginalProps.h;
                    stroke.x = this.dragOriginalProps.x + (newX - bounds.x);
                    stroke.y = this.dragOriginalProps.y + (newY - bounds.y);
                } 
                else if (stroke.points.length === 1) {
                    // Squash Dot Logic
                    stroke.sx = newW / this.dragOriginalBounds.w;
                    stroke.sy = newH / this.dragOriginalBounds.h;
                    stroke.points[0].x = newX + newW/2;
                    stroke.points[0].y = newY + newH/2;
                }
                else {
                    const pts = stroke.points;
                    const origPts = this.dragOriginalPoints;
                    for(let i=0; i<pts.length; i++) {
                        const normX = (origPts[i].x - bounds.x) / bounds.w;
                        const normY = (origPts[i].y - bounds.y) / bounds.h;
                        pts[i].x = newX + (normX * newW);
                        pts[i].y = newY + (normY * newH);
                    }
                }
            }

            this.calcBounds(this.selectedObject.stroke);
            this.renderCanvas();
            return;
        }

        if (this.isDrawing && this.currentStroke) {
            if (this.tool === 'brush' || this.tool === 'eraser') {
                const p = (typeof pressure === 'number') ? pressure : 0.5;
                this.currentStroke.points.push({x: pos.x, y: pos.y, p: p});
            } 
            else {
                const start = this.dragStart;
                const end = pos;
                if (this.tool === 'line') {
                    this.currentStroke.points = [{x:start.x, y:start.y, p:0.5}, {x:end.x, y:end.y, p:0.5}];
                } 
                else if (this.tool === 'rect') {
                    this.currentStroke.points = [
                        {x: start.x, y: start.y, p:0.5}, {x: end.x, y: start.y, p:0.5},
                        {x: end.x, y: end.y, p:0.5}, {x: start.x, y: end.y, p:0.5},
                        {x: start.x, y: start.y, p:0.5}
                    ];
                }
                else if (this.tool === 'circle') {
                    const rx = (end.x - start.x) / 2;
                    const ry = (end.y - start.y) / 2;
                    const cx = start.x + rx;
                    const cy = start.y + ry;
                    const segments = 32;
                    const pts = [];
                    for(let i=0; i<=segments; i++) {
                        const theta = (i / segments) * Math.PI * 2;
                        pts.push({
                            x: cx + rx * Math.cos(theta),
                            y: cy + ry * Math.sin(theta),
                            p: 0.5
                        });
                    }
                    this.currentStroke.points = pts;
                }
            }
            this.renderCanvas();
        }
    }

    onUp() {
        if (this.isDrawing) {
            if ((this.tool === 'brush' || this.tool === 'eraser') && this.currentStroke.points.length > 5) {
                this.currentStroke.points = this.simplifyPoints(this.currentStroke.points, 1.5);
            }
            this.isDrawing = false;
            this.currentStroke = null;
            this.updateThumbnails();
            this.saveStorage();
        }
        if (this.dragMode) {
            this.dragMode = null;
            this.updateThumbnails();
            this.saveStorage();
        }
    }
    
    simplifyPoints(points, tolerance) {
        if (points.length <= 2) return points;
        const newPoints = [points[0]];
        let lastPoint = points[0];
        for (let i = 1; i < points.length - 1; i++) {
            const p = points[i];
            const dist = Math.hypot(p.x - lastPoint.x, p.y - lastPoint.y);
            if (dist > tolerance) { newPoints.push(p); lastPoint = p; }
        }
        newPoints.push(points[points.length - 1]);
        return newPoints;
    }

    /* --- Vector Math & Hit Testing --- */
    hitTest(pos) {
        const checkList = (list, layerName) => {
            for (let i = list.length - 1; i >= 0; i--) {
                const obj = list[i];
                if (obj.type === 'text') {
                    const w = obj.width * obj.sx;
                    const h = obj.height * obj.sy;
                    const bx = obj.x;
                    const by = obj.y - h; 
                    if(pos.x >= bx && pos.x <= bx + w && pos.y >= by && pos.y <= by + h + 10) {
                        return { stroke: obj, layer: layerName, index: i };
                    }
                } else {
                    if (this.strokeHit(obj, pos)) return { stroke: obj, layer: layerName, index: i };
                }
            }
            return null;
        };
        if (this.activeLayer === 'ink') return checkList(this.frames[this.frameIndex].strokes, 'ink');
        else return checkList(this.paperStrokes, 'paper');
    }

    strokeHit(stroke, pos) {
        if (!stroke.points || stroke.points.length === 0) return false;
        
        const hitThresh = Math.max(10, stroke.size);

        // 0. Handle Dot (Single Point)
        if (stroke.points.length === 1) {
             const p = stroke.points[0];
             // Hit test against squashed ellipse? 
             // Simplified circular hit test using max dimension is usually fine for UI
             const dist = Math.hypot(pos.x - p.x, pos.y - p.y);
             // Use scale factors if they exist (squashed dot), otherwise 1
             const sx = stroke.sx || 1;
             const sy = stroke.sy || 1;
             const maxDim = Math.max(sx, sy) * (stroke.size/2);
             
             return dist < maxDim + 10; // +10 for easier grabbing
        }
        
        let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
        stroke.points.forEach(p=>{ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; });
        
        if(pos.x < minX-hitThresh || pos.x > maxX+hitThresh || pos.y < minY-hitThresh || pos.y > maxY+hitThresh) return false;

        for (let i = 0; i < stroke.points.length - 1; i++) {
            if (this.distToSegment(pos, stroke.points[i], stroke.points[i+1]) < hitThresh) return true;
        }

        if (this.tool === 'bucket' || stroke.fillColor) {
            if (this.containsPoint(stroke.points, pos)) return true;
        }
        return false;
    }

    containsPoint(points, pos) {
        let inside = false;
        for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
            const xi = points[i].x, yi = points[i].y;
            const xj = points[j].x, yj = points[j].y;
            const intersect = ((yi > pos.y) !== (yj > pos.y)) && (pos.x < (xj - xi) * (pos.y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    hitTestHandles(pos) {
        const b = this.selectedObject.bounds;
        const s = 10; 
        const hit = (x, y) => Math.abs(pos.x - x) < s && Math.abs(pos.y - y) < s;
        
        if (hit(b.x + b.w/2, b.y - 25)) return 'rotate';

        if (hit(b.x, b.y)) return 'resize-tl';
        if (hit(b.x+b.w, b.y)) return 'resize-tr';
        if (hit(b.x, b.y+b.h)) return 'resize-bl';
        if (hit(b.x+b.w, b.y+b.h)) return 'resize-br';
        
        if (hit(b.x + b.w/2, b.y)) return 'resize-t';      
        if (hit(b.x + b.w/2, b.y + b.h)) return 'resize-b';
        if (hit(b.x, b.y + b.h/2)) return 'resize-l';      
        if (hit(b.x + b.w, b.y + b.h/2)) return 'resize-r';
        
        return null;
    }

    distToSegment(p, v, w) {
        const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    calcBounds(stroke) {
        if (stroke.type === 'text') {
            const w = stroke.width * stroke.sx;
            const h = stroke.height * stroke.sy;
            this.selectedObject.bounds = {
                x: stroke.x - 5,
                y: stroke.y - h - 5,
                w: w + 10,
                h: h + 15
            };
        } 
        else if (stroke.points.length === 1) {
            // FIX: Specific bounds for single Dots
            const s = stroke.size;
            // Use stored scale or default to 1
            const sx = stroke.sx || 1;
            const sy = stroke.sy || 1;
            
            const p = stroke.points[0];
            const w = s * sx;
            const h = s * sy;
            
            this.selectedObject.bounds = {
                x: p.x - w/2, 
                y: p.y - h/2, 
                w: w, 
                h: h
            };
        }
        else {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            stroke.points.forEach(p => {
                if(p.x < minX) minX = p.x;
                if(p.x > maxX) maxX = p.x;
                if(p.y < minY) minY = p.y;
                if(p.y > maxY) maxY = p.y;
            });
            const pad = stroke.size / 2;
            this.selectedObject.bounds = { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad*2, h: (maxY - minY) + pad*2 };
        }
    }

    isInBounds(pos, rect) {
        return pos.x >= rect.x && pos.x <= rect.x + rect.w && pos.y >= rect.y && pos.y <= rect.y + rect.h;
    }

    /* --- Rendering --- */
    renderCanvas() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
        
        ctx.fillStyle = this.selectedBgColor; 
        ctx.fillRect(0,0,this.canvasWidth, this.canvasHeight);
        
        this.paperStrokes.forEach(s => this.drawObject(ctx, s));
        
        // Draw Current Ink Layer FIRST
        this.frames[this.frameIndex].strokes.forEach(s => this.drawObject(ctx, s));

        // Draw Onion Skin LAST (On Top)
        if (this.isOnion && this.frameIndex > 0 && !this.isPlaying) {
            ctx.globalAlpha = 0.3;
            // Fix: Pass 'true' for simpleMode to prevent alpha accumulation
            this.frames[this.frameIndex - 1].strokes.forEach(s => this.drawObject(ctx, s, true));
            ctx.globalAlpha = 1.0;
        }

        if (this.isWiggle && this.isPlaying) this.canvas.classList.add('wiggling');
        else this.canvas.classList.remove('wiggling');

        if (this.selectedObject && !this.isPlaying) {
            // Safety Check: Ensure object actually exists in current list before drawing UI
            const list = this.selectedObject.layer === 'ink' ? this.frames[this.frameIndex].strokes : this.paperStrokes;
            if (list.includes(this.selectedObject.stroke)) {
                this.drawSelectionUI(ctx);
            } else {
                this.selectedObject = null; // Cleanup ghost selection
            }
        }
    }

    drawObject(ctx, obj, simpleMode = false) {
        if (obj.type === 'text') {
            ctx.save();
            ctx.translate(obj.x, obj.y);
            
            const sx = (isFinite(obj.sx) && obj.sx !== 0) ? obj.sx : 1;
            const sy = (isFinite(obj.sy) && obj.sy !== 0) ? obj.sy : 1;
            
            ctx.scale(sx, sy);
            ctx.font = `${obj.size}px sans-serif`;
            ctx.fillStyle = obj.color;
            
            // Fix: Multiply existing globalAlpha (onion skin) by object opacity
            const currentAlpha = ctx.globalAlpha;
            const objAlpha = obj.opacity !== undefined ? obj.opacity : 1;
            ctx.globalAlpha = currentAlpha * objAlpha;

            ctx.fillText(obj.text, 0, 0);
            ctx.restore();
        } else {
            this.drawStroke(ctx, obj, simpleMode);
        }
    }

    drawSelectionUI(ctx) {
        const b = this.selectedObject.bounds;
        ctx.save();
        ctx.strokeStyle = '#0A84FF';
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        ctx.moveTo(b.x + b.w/2, b.y);
        ctx.lineTo(b.x + b.w/2, b.y - 25);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(b.x + b.w/2, b.y - 25, 5, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.stroke();

        ctx.setLineDash([5, 5]);
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.setLineDash([]);
        
        const drawHandle = (x, y) => {
            ctx.fillStyle = '#fff';
            ctx.strokeStyle = '#3498db';
            ctx.fillRect(x-4, y-4, 8, 8);
            ctx.strokeRect(x-4, y-4, 8, 8);
        };
        
        drawHandle(b.x, b.y);
        drawHandle(b.x+b.w, b.y);
        drawHandle(b.x, b.y+b.h);
        drawHandle(b.x+b.w, b.y+b.h);

        drawHandle(b.x + b.w/2, b.y);           
        drawHandle(b.x + b.w/2, b.y + b.h);     
        drawHandle(b.x, b.y + b.h/2);           
        drawHandle(b.x + b.w, b.y + b.h/2);     
        
        ctx.restore();
    }

    // Updated to accept simpleMode
    drawStroke(ctx, stroke, simpleMode = false) {
        if (!stroke.points || stroke.points.length === 0) return;
        
        const hex = stroke.color;
        const alpha = stroke.opacity !== undefined ? stroke.opacity : 1.0;
        const rgba = this.hexToRgba(hex, alpha);
        
        ctx.fillStyle = rgba;
        ctx.strokeStyle = rgba;
        
        // FIX: Handle Dots (Length 1) FIRST so they work in Onion Skin mode
        if (stroke.points.length === 1) {
            const p = stroke.points[0];
            // In simpleMode (Onion), ignore pressure variation, use default 0.5 or stored p
            const pressure = simpleMode ? 0.5 : (p.p !== undefined ? p.p : 0.5);
            const w = stroke.size * pressure; 
            
            ctx.save();
            ctx.translate(p.x, p.y);
            // Apply squash transforms
            ctx.scale(stroke.sx || 1, stroke.sy || 1);
            
            ctx.beginPath();
            ctx.arc(0, 0, w/2, 0, Math.PI*2); // Draw at center
            ctx.fill();
            
            ctx.restore();
            return;
        }

        // Standard Line Rendering (Onion Skin or Geometric Shapes)
        if (simpleMode || stroke.type === 'rect' || stroke.type === 'line' || stroke.type === 'circle') {
             ctx.beginPath();
             
             // FIX: Apply 0.5 scale for Brush/Eraser onion skins so they match the pressure-sensitive look
             // Geometric shapes (rect/circle) keep full width
             let renderWidth = stroke.size;
             if (stroke.type === 'brush' || stroke.type === 'eraser') {
                 renderWidth = stroke.size * 0.5;
             }
             
             ctx.lineWidth = renderWidth;
             ctx.lineCap = 'round';
             ctx.lineJoin = 'round';
             
             ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
             for (let i = 1; i < stroke.points.length; i++) {
                 ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
             }
             if (stroke.fillColor) {
                 ctx.fillStyle = this.hexToRgba(stroke.fillColor, alpha); 
                 ctx.fill();
                 ctx.fillStyle = rgba; 
             }
             ctx.stroke();
             return;
        }
        
        // Pressure Sensitive Rendering (Active Brush)
        for (let i = 0; i < stroke.points.length - 1; i++) {
            const p1 = stroke.points[i];
            const p2 = stroke.points[i+1];
            
            const w1 = stroke.size * (p1.p !== undefined ? p1.p : 0.5);
            const w2 = stroke.size * (p2.p !== undefined ? p2.p : 0.5);
            
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            const steps = Math.ceil(dist / 2); 
            
            for (let j = 0; j <= steps; j++) {
                const t = j / steps;
                const x = p1.x + (p2.x - p1.x) * t;
                const y = p1.y + (p2.y - p1.y) * t;
                const w = w1 + (w2 - w1) * t;
                
                ctx.beginPath();
                ctx.arc(x, y, Math.max(1, w/2), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
    
    hexToRgba(hex, alpha) {
        let r=0,g=0,b=0;
        if (hex && hex.length === 7) {
            r = parseInt(hex.slice(1, 3), 16);
            g = parseInt(hex.slice(3, 5), 16);
            b = parseInt(hex.slice(5, 7), 16);
        }
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    setTool(t) {
        this.tool = t;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('tool-'+t);
        if(btn) btn.classList.add('active');
        
        const shapeAnchor = document.getElementById('tool-shape-anchor');
        const shapeIcon = shapeAnchor.querySelector('.main-icon');
        
        if (['rect', 'circle', 'line'].includes(t)) {
            shapeAnchor.classList.add('active');
            if (t === 'rect') { shapeIcon.className = 'far fa-square main-icon'; shapeIcon.style.transform = ''; }
            if (t === 'circle') { shapeIcon.className = 'far fa-circle main-icon'; shapeIcon.style.transform = ''; }
            if (t === 'line') { shapeIcon.className = 'fas fa-slash main-icon'; shapeIcon.style.transform = 'rotate(-45deg)'; }
        } else {
            shapeAnchor.classList.remove('active');
        }

        this.selectedObject = null;
        this.renderCanvas();
    }
    
    setLayer(l) {
        this.activeLayer = l;
        document.getElementById('layer-ink').classList.toggle('active', l==='ink');
        document.getElementById('layer-paper').classList.toggle('active', l==='paper');
        this.selectedObject = null;
        this.renderCanvas();
    }

    setColor(c) {
        this.brushColor = c;
        document.getElementById('html-color-picker').value = c;
        if (this.selectedObject) {
            this.saveState();
            this.selectedObject.stroke.color = c;
            if(this.selectedObject.stroke.fillColor) this.selectedObject.stroke.fillColor = c;
            this.renderCanvas();
            this.saveStorage();
        }
    }

    setSize(s) {
        this.brushSize = parseInt(s);
        document.getElementById('size-disp').innerText = s;
        if (this.selectedObject) {
            this.saveState();
            this.selectedObject.stroke.size = this.brushSize;
            this.calcBounds(this.selectedObject.stroke);
            this.renderCanvas();
            this.saveStorage();
        }
    }
    
    setOpacity(v) {
        this.opacity = parseInt(v) / 100;
        document.getElementById('op-disp').innerText = v;
        if (this.selectedObject) {
            this.saveState();
            this.selectedObject.stroke.opacity = this.opacity;
            this.renderCanvas();
            this.saveStorage();
        }
    }

    toggleOnion() {
        this.isOnion = !this.isOnion;
        document.getElementById('onion-btn').classList.toggle('active', this.isOnion);
        this.renderCanvas();
    }
    
    toggleWiggle() {
        this.isWiggle = !this.isWiggle;
        document.getElementById('wiggle-btn').classList.toggle('active', this.isWiggle);
        if(this.isPlaying) this.renderCanvas(); 
    }

    addFrame() {
        this.saveState();
        this.selectedObject = null; 
        this.frames.splice(this.frameIndex + 1, 0, { strokes: [] });
        this.frameIndex++;
        this.renderUI();
        this.renderCanvas();
        this.saveStorage();

        // FIX: Auto-scroll to show the Add Button
        setTimeout(() => {
            const addBtn = this.framesList.querySelector('.add-frame-btn');
            if(addBtn) addBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        }, 50);
    }

    duplicateFrame(index) {
        this.saveState();
        this.selectedObject = null; // Fix: Deselect to prevent ghost UI
        const target = index !== undefined ? index : this.frameIndex;
        // Ensure deep copy of all properties including text specific ones
        const newStrokes = JSON.parse(JSON.stringify(this.frames[target].strokes));
        this.frames.splice(target + 1, 0, { strokes: newStrokes });
        this.frameIndex = target + 1;
        this.renderUI();
        this.renderCanvas();
        this.saveStorage();
    }

    deleteFrame(index) {
        this.saveState();
        this.selectedObject = null; // Fix: Deselect
        const targetIndex = (index !== undefined) ? index : this.frameIndex;
        if(this.frames.length <= 1) { 
            this.frames[0].strokes = []; 
            this.renderCanvas();
        } else {
            this.frames.splice(targetIndex, 1);
            if(this.frameIndex >= this.frames.length) {
                this.frameIndex = this.frames.length - 1;
            } else if (this.frameIndex > targetIndex) {
                this.frameIndex--;
            }
        }
        this.renderUI();
        this.renderCanvas();
        this.saveStorage();
    }

    togglePlay() {
        if (this.isPlaying) {
            this.isPlaying = false;
            clearInterval(this.playInterval);
            document.querySelector('#play-btn i').className = 'fas fa-play';
            document.getElementById('play-btn').style.background = 'var(--accent-blue)';
            this.renderCanvas();
        } else {
            this.isPlaying = true;
            document.querySelector('#play-btn i').className = 'fas fa-stop';
            document.getElementById('play-btn').style.background = '#ff3b30';
            this.playInterval = setInterval(() => {
                this.frameIndex = (this.frameIndex + 1) % this.frames.length;
                this.renderCanvas();
                this.updateTimelineActive();
            }, 1000 / this.fps);
        }
    }

    setFps(val) {
        this.fps = parseInt(val);
        document.getElementById('fps-disp').innerText = val + " FPS";
        if(this.isPlaying) { this.togglePlay(); this.togglePlay(); }
        this.saveStorage();
    }

    renderUI(minimal = false) {
        if (!minimal) {
            this.framesList.innerHTML = '';
            this.frames.forEach((f, i) => {
                const el = document.createElement('div');
                el.className = `frame-card ${i === this.frameIndex ? 'active' : ''}`;
                el.onclick = () => { this.frameIndex = i; this.renderCanvas(); this.renderUI(true); };
                
                let html = `<div class="frame-num">${i+1}</div><img src="${f.thumb || ''}">`;
                if(this.frames.length > 1) {
                    html += `<div class="frame-delete-btn" onclick="event.stopPropagation(); app.deleteFrame(${i})" title="Delete Frame"><i class="fas fa-times"></i></div>`;
                }
                html += `<div class="frame-copy-btn" onclick="event.stopPropagation(); app.duplicateFrame(${i})" title="Duplicate Frame"><i class="fas fa-copy"></i></div>`;
                el.innerHTML = html;
                this.framesList.appendChild(el);
            });
            const addBtn = document.createElement('div');
            addBtn.className = 'add-frame-btn';
            addBtn.innerHTML = '+';
            addBtn.onclick = () => this.addFrame();
            this.framesList.appendChild(addBtn);
            this.updateThumbnails(); 
        } else {
            const cards = this.framesList.querySelectorAll('.frame-card');
            cards.forEach((c, i) => {
                if(i === this.frameIndex) {
                    c.classList.add('active');
                    c.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
                } else {
                    c.classList.remove('active');
                }
            });
        }
    }
    
    updateTimelineActive() {
        const cards = this.framesList.querySelectorAll('.frame-card');
        cards.forEach((c, i) => c.classList.toggle('active', i === this.frameIndex));
    }

    updateThumbnails() {
        const tCanvas = document.createElement('canvas');
        tCanvas.width = 120; tCanvas.height = 120;
        const tCtx = tCanvas.getContext('2d');
        const scale = 120 / this.canvasWidth; 
        tCtx.scale(scale, scale);

        this.frames.forEach((f, i) => {
            tCtx.clearRect(0,0,this.canvasWidth,this.canvasHeight);
            tCtx.fillStyle = this.selectedBgColor; 
            tCtx.fillRect(0,0,this.canvasWidth,this.canvasHeight);
            this.paperStrokes.forEach(s => this.drawObject(tCtx, s));
            f.strokes.forEach(s => this.drawObject(tCtx, s));
            f.thumb = tCanvas.toDataURL();
        });
        
        const imgs = this.framesList.querySelectorAll('.frame-card img');
        imgs.forEach((img, i) => {
            if(this.frames[i]) img.src = this.frames[i].thumb;
        });
    }

    saveStorage() {
        if (this.saveTimer) clearTimeout(this.saveTimer);
        this.saveTimer = setTimeout(() => {
            const data = {
                version: 3,
                frames: this.frames,
                paperStrokes: this.paperStrokes,
                fps: this.fps,
                width: this.canvasWidth,
                height: this.canvasHeight
            };
            try {
                const cleanFrames = this.frames.map(f => ({strokes: f.strokes}));
                const jsonStr = JSON.stringify({...data, frames: cleanFrames});
                const size = jsonStr.length; 
                const limit = 5 * 1024 * 1024; 
                const pct = Math.min(100, (size / limit) * 100);
                const bar = document.getElementById('storage-bar');
                if(bar) {
                    bar.style.width = pct + '%';
                    if (pct > 90) bar.style.background = '#ff3b30'; 
                    else if (pct > 70) bar.style.background = '#f1c40f'; 
                    else bar.style.background = '#2ecc71'; 
                }
                localStorage.setItem('sketchMotionVector', jsonStr);
                const ind = document.getElementById('save-indicator');
                ind.style.opacity = 1;
                setTimeout(()=>ind.style.opacity=0, 1500);
            } catch(e) { 
                console.log("Storage Limit Reached"); 
                const bar = document.getElementById('storage-bar');
                if(bar) {
                    bar.style.width = '100%';
                    bar.style.background = '#ff3b30';
                }
                alert("Storage Full! Please export your project to save properly.");
            }
        }, 1000);
    }

    loadStorage() {
        const raw = localStorage.getItem('sketchMotionVector');
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if(data.version >= 2) {
                    this.frames = data.frames;
                    this.paperStrokes = data.paperStrokes || [];
                    this.fps = data.fps || 12;
                    this.frameIndex = 0;
                    if(data.width && data.height) this.resizeCanvas(data.width, data.height);
                    if(data.palette) {
                        this.palette = data.palette;
                        this.renderPalette();
                    }
                    this.renderUI();
                    this.renderCanvas();
                }
            } catch(e) { console.log('Error loading', e); }
        }
    }

    exportGIF() {
        document.getElementById('loading-overlay').style.display = 'flex';
        const framesData = [];
        const tempC = document.createElement('canvas');
        tempC.width = this.canvasWidth; tempC.height = this.canvasHeight;
        const tCtx = tempC.getContext('2d');

        setTimeout(() => {
            this.frames.forEach(f => {
                tCtx.clearRect(0,0,this.canvasWidth,this.canvasHeight);
                tCtx.fillStyle = this.selectedBgColor; 
                tCtx.fillRect(0,0,this.canvasWidth,this.canvasHeight);
                this.paperStrokes.forEach(s => this.drawObject(tCtx, s));
                f.strokes.forEach(s => this.drawObject(tCtx, s));
                framesData.push(tempC.toDataURL());
            });

            gifshot.createGIF({
                images: framesData,
                interval: 1/this.fps,
                gifWidth: this.canvasWidth, gifHeight: this.canvasHeight
            }, (obj) => {
                document.getElementById('loading-overlay').style.display = 'none';
                if(!obj.error) {
                    const a = document.createElement('a');
                    a.href = obj.image;
                    a.download = 'sketchmotion.gif';
                    a.click();
                } else {
                    alert('Error exporting GIF');
                }
            });
        }, 100);
    }
    
    saveProject() {
        const data = {
            version: 3,
            frames: this.frames.map(f => ({strokes: f.strokes})),
            paperStrokes: this.paperStrokes,
            fps: this.fps,
            width: this.canvasWidth,
            height: this.canvasHeight,
            palette: this.palette
        };
        const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'motionsketch.json';
        a.click();
    }
    
    openProject() { document.getElementById('file-input').click(); }
    
    handleFileUpload(el) {
        const file = el.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if(data.version >= 2) {
                    this.frames = data.frames;
                    this.paperStrokes = data.paperStrokes || [];
                    this.fps = data.fps;
                    this.frameIndex = 0;
                    if(data.width && data.height) this.resizeCanvas(data.width, data.height);
                    if(data.palette) {
                        this.palette = data.palette;
                        this.renderPalette();
                    }
                    this.renderUI();
                    this.renderCanvas();
                }
            } catch(err) { alert('Invalid File'); }
            el.value = '';
        };
        reader.readAsText(file);
    }
    
    requestNewAnimation() { document.getElementById('custom-modal').style.display = 'flex'; }
    closeModal(id) { 
        if (id) document.getElementById(id).style.display = 'none';
        else document.getElementById('custom-modal').style.display = 'none'; 
    }
    confirmNewAnimation() {
        this.closeModal();
        this.frames = [{strokes:[]}];
        this.paperStrokes = [];
        this.frameIndex = 0;
        this.selectedBgColor = '#ffffff';
        // RESET SELECTED OBJECT HERE TO PREVENT GHOST SELECTION
        this.selectedObject = null;
        this.dragMode = null;
        // Reset History
        this.history = [];
        this.redoStack = [];
        
        this.renderUI();
        this.renderCanvas();
        this.saveStorage();
    }
    deleteSelected() {
        if (!this.selectedObject) return;
        this.saveState();
        const list = this.activeLayer === 'ink' ? this.frames[this.frameIndex].strokes : this.paperStrokes;
        
        const idx = list.indexOf(this.selectedObject.stroke);
        if (idx > -1) list.splice(idx, 1);
        
        // IMPORTANT: Force deselect here to prevent UI ghost
        this.selectedObject = null;
        this.dragMode = null;
        
        this.renderCanvas();
        this.saveStorage();
        this.updateThumbnails();
    }
    copySelection() { if (this.selectedObject) this.clipboard = JSON.parse(JSON.stringify(this.selectedObject.stroke)); }
    pasteSelection() {
        if (this.clipboard) {
            this.saveState();
            const newStroke = JSON.parse(JSON.stringify(this.clipboard));
            if(newStroke.type !== 'text') {
                newStroke.points.forEach(p => { p.x += 20; p.y += 20; });
            } else {
                newStroke.x += 20; newStroke.y += 20;
            }
            const list = this.activeLayer === 'ink' ? this.frames[this.frameIndex].strokes : this.paperStrokes;
            list.push(newStroke);
            this.selectedObject = { stroke: newStroke, layer: this.activeLayer };
            this.calcBounds(newStroke);
            this.renderCanvas();
            this.saveStorage();
            this.updateThumbnails();
        }
    }
}

function initApp() {
    const c = document.getElementById('rendering-canvas');
    if(!c) {
        setTimeout(initApp, 50);
        return;
    }
    window.app = new MotionSketchVector();
}

if (document.readyState === 'complete' || document.readyState === 'interactive') {
    initApp();
} else {
    document.addEventListener('DOMContentLoaded', initApp);
}
</script>
